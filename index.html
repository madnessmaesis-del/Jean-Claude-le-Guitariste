<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d28d9"><title>Jean-Claude le Guitariste</title><style>body{margin:0;font-family:system-ui;background:#fff9ed;color:#1e293b}header{position:sticky;top:0;background:white;padding:14px;border-bottom:4px solid #fde68a;font-weight:900;font-size:22px;z-index:3}.wrap{max-width:850px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#7c3aed,#4338ca);color:white;padding:28px;border-radius:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:20px}.card,.mission{background:white;border:0;border-radius:24px;padding:20px;box-shadow:0 3px 15px #0001;text-align:left;width:100%;font-size:16px}.card:disabled{opacity:.45}.big{font-size:52px}.btn{display:inline-block;background:#facc15;color:#3b0764;padding:14px 20px;border-radius:16px;border:0;font-weight:900;font-size:18px;text-decoration:none}.blue{background:#0ea5e9;color:white}.green{background:#22c55e;color:white}.red{background:#ef4444;color:white}.words{font-size:34px;background:#fef3c7;border-radius:20px;padding:22px;text-align:center}.hidden{display:none}h1{font-size:36px}.progress{height:18px;background:#eee;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#facc15,#f97316)}button{cursor:pointer}</style></head><body><header>🎸 Jean-Claude le Guitariste <span id="stars" style="float:right">⭐ 0</span></header><main class="wrap"><section id="home"><div class="hero"><h1>On joue de la guitare ?</h1><p>Regarde • écoute • essaie • gagne une étoile</p><button class="btn" onclick="openNext()">▶ C'EST PARTI !</button></div><h2>Mon aventure</h2><div class="progress"><div id="bar" class="bar"></div></div><div id="worlds" class="grid"></div></section><section id="level" class="hidden"></section><section id="lesson" class="hidden"></section></main><script>const LEVELS=[{"id": 1, "name": "Explorateur", "emoji": "🐣", "goal": "Tenir la guitare et découvrir les cordes", "time": "3 à 5 min", "missions": [{"id": "1a", "title": "Je tiens ma guitare", "icon": "🪑", "text": "Pose la guitare sur ta cuisse. Garde le dos tranquille et les épaules détendues.", "video": "https://www.youtube.com/watch?v=yv6leNpIJ9w"}, {"id": "1b", "title": "Je réveille les cordes", "icon": "🌈", "text": "Fais sonner chaque corde, de la plus grosse à la plus fine.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM"}, {"id": "1c", "title": "Lion et souris", "icon": "🦁", "text": "Joue une corde fort, puis doucement.", "video": ""}]}, {"id": 2, "name": "Gardien du rythme", "emoji": "🥁", "goal": "Jouer régulièrement avec la main droite", "time": "4 à 5 min", "missions": [{"id": "2a", "title": "Le cœur de la musique", "icon": "💓", "text": "Tape doucement sur la caisse : 1, 2, 3, 4.", "video": ""}, {"id": "2b", "title": "Quatre coups magiques", "icon": "✨", "text": "Fais glisser ton pouce vers le bas quatre fois.", "video": ""}, {"id": "2c", "title": "Feu rouge, feu vert", "icon": "🚦", "text": "Joue au vert. Arrête-toi au rouge.", "video": ""}]}, {"id": 3, "name": "Chasseur de notes", "emoji": "🦊", "goal": "Poser les doigts et produire des notes claires", "time": "5 min", "missions": [{"id": "3a", "title": "Le doigt rond", "icon": "☝️", "text": "Pose l’index juste derrière la première barrette.", "video": ""}, {"id": "3b", "title": "Ouvert, fermé", "icon": "🚪", "text": "Écoute la différence entre corde ouverte et doigt posé.", "video": ""}, {"id": "3c", "title": "Trois petites notes", "icon": "🎵", "text": "Joue lentement : ouvert, doigt, ouvert.", "video": ""}]}, {"id": 4, "name": "Escalier des notes", "emoji": "🪜", "goal": "Monter et descendre une mini-gamme", "time": "5 à 6 min", "missions": [{"id": "4a", "title": "Do Ré Mi en couleurs", "icon": "🎨", "text": "Associe chaque son à sa couleur : Do rouge, Ré orange, Mi jaune.", "video": "https://www.youtube.com/watch?v=ZQFgHAc8WR4"}, {"id": "4b", "title": "Je monte", "icon": "⬆️", "text": "Joue Do, Ré, Mi, Fa, sans accélérer.", "video": "https://www.youtube.com/watch?v=ZQFgHAc8WR4"}, {"id": "4c", "title": "Je redescends", "icon": "⬇️", "text": "Joue Fa, Mi, Ré, Do.", "video": "https://www.youtube.com/watch?v=h1sP7Z9mybE"}]}, {"id": 5, "name": "Arc-en-ciel musical", "emoji": "🌈", "goal": "Découvrir la gamme de Do sans se presser", "time": "6 min", "missions": [{"id": "5a", "title": "Cinq marches", "icon": "🖐️", "text": "Joue Do, Ré, Mi, Fa, Sol.", "video": "https://www.youtube.com/watch?v=ZQFgHAc8WR4"}, {"id": "5b", "title": "La gamme arc-en-ciel", "icon": "🌈", "text": "Observe Do, Ré, Mi, Fa, Sol, La, Si, Do.", "video": "https://www.youtube.com/watch?v=h1sP7Z9mybE"}, {"id": "5c", "title": "La tortue du rythme", "icon": "🐢", "text": "Joue lentement et régulièrement.", "video": ""}]}, {"id": 6, "name": "Fabrique à mélodies", "emoji": "🏭", "goal": "Transformer les notes en petite phrase musicale", "time": "6 à 7 min", "missions": [{"id": "6a", "title": "Question musicale", "icon": "❓", "text": "Joue Do, Ré, Mi, puis fais une pause.", "video": ""}, {"id": "6b", "title": "Réponse musicale", "icon": "💬", "text": "Joue Mi, Ré, Do, puis arrête-toi.", "video": ""}, {"id": "6c", "title": "Mon motif secret", "icon": "🔐", "text": "Choisis trois notes et répète-les.", "video": ""}]}, {"id": 7, "name": "Atelier comptine", "emoji": "🐢", "goal": "Préparer une comptine très courte", "time": "6 à 8 min", "missions": [{"id": "7a", "title": "J’écoute et je frappe", "icon": "👂", "text": "Écoute une comptine et frappe son rythme.", "video": "https://music.youtube.com/playlist?list=PLyRtUuePJnRW_SYzp3jUeNCAmXweiR2s8"}, {"id": "7b", "title": "Deux petits morceaux", "icon": "🧩", "text": "Découpe la mélodie en deux petits fragments.", "video": "https://music.youtube.com/playlist?list=PLyRtUuePJnRW_SYzp3jUeNCAmXweiR2s8"}, {"id": "7c", "title": "Je rassemble", "icon": "🔗", "text": "Rassemble les deux fragments lentement.", "video": ""}]}, {"id": 8, "name": "Mini concert", "emoji": "🏆", "goal": "Jouer quelques secondes du début à la fin", "time": "5 à 8 min", "missions": [{"id": "8a", "title": "Répétition générale", "icon": "🎬", "text": "Refais la comptine sans t’arrêter pour une petite erreur.", "video": ""}, {"id": "8b", "title": "Mon mini-concert", "icon": "🎭", "text": "Présente ta comptine et joue-la devant une personne.", "video": ""}, {"id": "8c", "title": "Diplôme des étoiles", "icon": "🌟", "text": "Choisis ton exercice préféré et rejoue-le.", "video": ""}]}];let p=JSON.parse(localStorage.getItem('jc-guitare')||'{"done":{},"stars":0}');function save(){localStorage.setItem('jc-guitare',JSON.stringify(p));render()}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.82;speechSynthesis.speak(u)}function show(id){for(const x of ['home','level','lesson'])document.getElementById(x).classList.toggle('hidden',x!==id)}function unlocked(i){return i===0||LEVELS[i-1].missions.every(m=>p.done[m.id])}function render(){stars.textContent='⭐ '+p.stars;let total=LEVELS.flatMap(x=>x.missions).length,done=Object.keys(p.done).length;bar.style.width=(done/total*100)+'%';worlds.innerHTML=LEVELS.map((l,i)=>`<button class="card" ${unlocked(i)?'':'disabled'} onclick="openLevel(${i})"><div class="big">${unlocked(i)?l.emoji:'🔒'}</div><b>MONDE ${l.id}</b><h2>${l.name}</h2><p>${l.goal}</p><b>⏱️ ${l.time}</b></button>`).join('')}function openLevel(i){let l=LEVELS[i];level.innerHTML=`<button class="btn" onclick="show('home')">← Retour</button><div class="hero"><div class="big">${l.emoji}</div><h1>${l.name}</h1><p>${l.goal}</p><b>⏱️ Temps conseillé : ${l.time}</b></div>${l.missions.map(m=>`<button class="mission" onclick="openMission(${i},'${m.id}')"><span class="big">${p.done[m.id]?'✅':m.icon}</span><h2>${m.title}</h2></button>`).join('')}`;show('level')}function openMission(i,id){let m=LEVELS[i].missions.find(x=>x.id===id);lesson.innerHTML=`<button class="btn" onclick="openLevel(${i})">← Missions</button><div class="card" style="text-align:center"><div class="big">${m.icon}</div><h1>${m.title}</h1><div class="words">🎸 ➜ 👀 ➜ 🎵</div><p style="font-size:22px;font-weight:800">${m.text}</p><button class="btn blue" onclick='speak(${JSON.stringify(m.text)})'>🔊 ÉCOUTE</button>${m.video?` <a class="btn red" target="_blank" href="${m.video}">▶ VIDÉO</a>`:''}<p><button class="btn green" onclick="finish('${m.id}',${i})">✓ J'AI RÉUSSI</button></p></div>`;show('lesson')}function finish(id,i){if(!p.done[id]){p.done[id]=true;p.stars++}save();alert('Bravo ! Une étoile gagnée ⭐');openLevel(i)}function openNext(){for(let i=0;i<LEVELS.length;i++){let m=LEVELS[i].missions.find(x=>!p.done[x.id]);if(m){openLevel(i);return}}openLevel(7)}render();</script></body></html>
