<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b172a"><title>Petit Guitariste avec Jean-Claude</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Nunito,system-ui,sans-serif;background:#eef5ec;color:#102c5a}button,a,input,select{font:inherit}.top{position:sticky;top:0;z-index:9;background:#091528;color:white;display:flex;align-items:center;justify-content:space-between;padding:12px max(18px,calc((100% - 1180px)/2));box-shadow:0 4px 16px #0002}.brand{font-weight:1000;font-size:22px}.brand small{display:block;font-size:11px}.tabs{display:flex;gap:10px}.tabs button{border:0;border-radius:14px;background:#172943;color:white;padding:12px 18px;font-weight:900}.tabs button.active{background:#eff7ff;color:#2167c8}.stars{font-weight:1000;color:#ffd43b}.wrap{max-width:1180px;margin:auto;padding:18px}.hero{display:grid;grid-template-columns:1.5fr 1fr;background:#fff4b8;border-radius:30px;overflow:hidden;box-shadow:0 16px 40px #174d3020}.heroimg{min-height:430px;background:url('jean-claude-accueil.png') center/cover}.herotext{padding:32px;display:flex;flex-direction:column;justify-content:center;text-align:center}.bubble{background:white;border-radius:35px;padding:24px;border:2px solid #ddd;font-size:25px;font-weight:1000}.cta,.primary,.success,.video{border:0;border-radius:18px;padding:16px 22px;font-weight:1000;text-decoration:none;display:inline-block;cursor:pointer}.cta,.success{background:#32bd5c;color:white;box-shadow:0 6px 0 #188739}.primary{background:#347de2;color:white}.video{background:#ef3e36;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:18px}.world{background:white;border:0;border-radius:25px;padding:20px;text-align:left;box-shadow:0 7px 22px #0001;min-height:255px}.world:disabled{filter:grayscale(1);opacity:.55}.world .ico{font-size:48px;text-align:center}.world h2{text-align:center}.missionrow{display:flex;gap:10px;background:#f7faf7;border-radius:15px;padding:11px;margin:8px 0;font-weight:800}.panel{background:white;border-radius:28px;padding:28px;box-shadow:0 10px 28px #0001}.back{margin-bottom:12px}.lesson{display:grid;grid-template-columns:1.15fr .85fr;gap:20px}.visual{min-height:430px;border-radius:24px;background:#fff5c9;display:flex;align-items:center;justify-content:center;overflow:hidden}.visual.posture{background:url('jean-claude-posture.png') center/cover}.diagram{font-size:60px;text-align:center;line-height:1.7;padding:25px}.lesson h1{font-size:38px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.advice{background:#fff7cc;border-radius:18px;padding:16px;margin-top:16px}.progress{height:20px;background:#e5e7eb;border-radius:20px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#43c867,#ffcf32)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{background:white;border-radius:22px;padding:22px}.hidden{display:none}@media(max-width:850px){.tabs button span{display:none}.grid{grid-template-columns:1fr 1fr}.hero,.lesson{grid-template-columns:1fr}.heroimg{min-height:340px}.settings{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.heroimg{min-height:280px}.herotext{padding:18px}.bubble{font-size:20px}.top{padding:9px}.brand{font-size:17px}.tabs{gap:5px}.tabs button{padding:10px}.lesson h1{font-size:30px}}
</style></head><body><nav class="top"><div class="brand">🎸 Petit Guitariste<small>avec Jean-Claude</small></div><div class="tabs"><button id="navHome" class="active" onclick="home()">🏠 <span>Accueil</span></button><button onclick="home()">🎓 <span>Niveaux</span></button><button onclick="progressPage()">⭐ <span>Mes progrès</span></button><button onclick="settingsPage()">⚙️ <span>Réglages</span></button></div><div class="stars" id="stars">⭐ 0</div></nav><main class="wrap" id="app"></main><input id="importFile" class="hidden" type="file" accept="application/json"><script>
const LEVELS=[{"id": 1, "name": "Découvrir ma guitare", "emoji": "🐣", "time": "3 à 5 min", "missions": [{"id": "1a", "title": "Tenir la guitare", "icon": "🪑", "say": "Assieds-toi confortablement. Pose la guitare sur ta cuisse et relâche tes épaules.", "video": "https://www.youtube.com/watch?v=yv6leNpIJ9w", "demo": "posture"}, {"id": "1b", "title": "Découvrir les cordes", "icon": "🌈", "say": "Avec ton pouce, fais sonner les six cordes doucement, de la plus grosse à la plus fine.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "strings"}, {"id": "1c", "title": "Faire de jolis sons", "icon": "🦁", "say": "Joue un son fort comme un lion, puis doux comme une petite souris.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "lion"}]}, {"id": 2, "name": "Le rythme, c’est la vie", "emoji": "🥁", "time": "4 à 5 min", "missions": [{"id": "2a", "title": "Taper le rythme", "icon": "💓", "say": "Tape doucement sur la caisse : un, deux, trois, quatre.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "beats"}, {"id": "2b", "title": "Suivre la musique", "icon": "✨", "say": "Fais glisser ton pouce vers le bas quatre fois, sans accélérer.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "down"}, {"id": "2c", "title": "Feu rouge, feu vert", "icon": "🚦", "say": "Vert : tu joues. Rouge : tu t’arrêtes comme une statue.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "lights"}]}, {"id": 3, "name": "Mes premières notes", "emoji": "🦊", "time": "5 min", "missions": [{"id": "3a", "title": "Le doigt rond", "icon": "☝️", "say": "Pose ton index juste derrière la première barrette et garde le doigt rond.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "finger"}, {"id": "3b", "title": "Ouvert, fermé", "icon": "🚪", "say": "Joue la corde sans doigt, puis avec ton index posé. Écoute la différence.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "pattern"}, {"id": "3c", "title": "Trois petites notes", "icon": "🎵", "say": "Joue lentement : corde ouverte, doigt posé, corde ouverte.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "pattern"}]}, {"id": 4, "name": "L’escalier des notes", "emoji": "🪜", "time": "5 à 6 min", "missions": [{"id": "4a", "title": "Do Ré Mi en couleurs", "icon": "🎨", "say": "Monte trois marches : Do, Ré, Mi.", "video": "https://www.youtube.com/watch?v=ZQFgHAc8WR4", "demo": "scale3"}, {"id": "4b", "title": "Je monte", "icon": "⬆️", "say": "Joue Do, Ré, Mi, Fa, lentement.", "video": "https://www.youtube.com/watch?v=ZQFgHAc8WR4", "demo": "scale4"}, {"id": "4c", "title": "Je redescends", "icon": "⬇️", "say": "Joue Fa, Mi, Ré, Do, sans te presser.", "video": "https://www.youtube.com/watch?v=h1sP7Z9mybE", "demo": "scaledown"}]}, {"id": 5, "name": "Arc-en-ciel musical", "emoji": "🌈", "time": "6 min", "missions": [{"id": "5a", "title": "Cinq marches", "icon": "🖐️", "say": "Joue Do, Ré, Mi, Fa, Sol, une note après l’autre.", "video": "https://www.youtube.com/watch?v=ZQFgHAc8WR4", "demo": "scale5"}, {"id": "5b", "title": "La gamme arc-en-ciel", "icon": "🌈", "say": "Observe toute la gamme puis joue seulement la partie facile.", "video": "https://www.youtube.com/watch?v=h1sP7Z9mybE", "demo": "scale8"}, {"id": "5c", "title": "La tortue du rythme", "icon": "🐢", "say": "Joue ta mini-gamme très lentement et régulièrement.", "video": "https://www.youtube.com/watch?v=h1sP7Z9mybE", "demo": "beats"}]}, {"id": 6, "name": "Fabrique à mélodies", "emoji": "🏭", "time": "6 à 7 min", "missions": [{"id": "6a", "title": "Question musicale", "icon": "❓", "say": "Joue Do, Ré, Mi, puis fais une pause.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "question"}, {"id": "6b", "title": "Réponse musicale", "icon": "💬", "say": "Réponds avec Mi, Ré, Do.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "answer"}, {"id": "6c", "title": "Mon motif secret", "icon": "🔐", "say": "Choisis trois notes et joue-les deux fois dans le même ordre.", "video": "https://www.youtube.com/playlist?list=PLxM95G6okVNS2DPcQgqNqPCOnBaXz-rzM", "demo": "stars"}]}, {"id": 7, "name": "Atelier comptine", "emoji": "🎶", "time": "6 à 8 min", "missions": [{"id": "7a", "title": "J’écoute et je frappe", "icon": "👂", "say": "Écoute une comptine et frappe doucement son rythme dans tes mains.", "video": "https://music.youtube.com/playlist?list=PLyRtUuePJnRW_SYzp3jUeNCAmXweiR2s8", "demo": "beats"}, {"id": "7b", "title": "Deux petits morceaux", "icon": "🧩", "say": "Apprends un petit bout, puis le deuxième.", "video": "https://music.youtube.com/playlist?list=PLyRtUuePJnRW_SYzp3jUeNCAmXweiR2s8", "demo": "question"}, {"id": "7c", "title": "Je rassemble", "icon": "🔗", "say": "Joue le premier bout, respire, puis joue le deuxième.", "video": "https://music.youtube.com/playlist?list=PLyRtUuePJnRW_SYzp3jUeNCAmXweiR2s8", "demo": "song"}]}, {"id": 8, "name": "Mini-concert", "emoji": "🏆", "time": "5 à 8 min", "missions": [{"id": "8a", "title": "Répétition générale", "icon": "🎬", "say": "Installe-toi, respire et joue ta comptine lentement.", "video": "https://music.youtube.com/playlist?list=PLyRtUuePJnRW_SYzp3jUeNCAmXweiR2s8", "demo": "song"}, {"id": "8b", "title": "Mon mini-concert", "icon": "🎭", "say": "Salue ton public, joue ta comptine, puis dis merci.", "video": "https://music.youtube.com/playlist?list=PLyRtUuePJnRW_SYzp3jUeNCAmXweiR2s8", "demo": "show"}, {"id": "8c", "title": "Diplôme des étoiles", "icon": "🌟", "say": "Bravo ! Rejoue ton exercice préféré.", "video": "https://music.youtube.com/playlist?list=PLyRtUuePJnRW_SYzp3jUeNCAmXweiR2s8", "demo": "stars"}]}];const KEY='jc-guitare';let p=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"stars":0,"voice":""}');let voices=[];const app=document.getElementById('app');function save(){localStorage.setItem(KEY,JSON.stringify(p);)}function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith('fr'));}loadVoices();if(speechSynthesis.onvoiceschanged!==undefined)speechSynthesis.onvoiceschanged=loadVoices;function bestVoice(){return voices.find(v=>v.name===p.voice)||voices.find(v=>/audrey|thomas|hortense|paul|denise|google français|microsoft/i.test(v.name))||voices[0]}function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;u.pitch=1;let v=bestVoice();if(v)u.voice=v;speechSynthesis.speak(u)}function unlocked(i){return i===0||LEVELS[i-1].missions.every(m=>p.done[m.id])}function stars(){document.getElementById('stars').textContent='⭐ '+p.stars}function home(){stars();app.innerHTML=`<section class="hero"><div class="heroimg"></div><div class="herotext"><div class="bubble">Salut ! Moi, c’est Jean-Claude.<br>On apprend la guitare ensemble ? 🎵</div><p><button class="primary" onclick="speak('Salut ! Moi, c’est Jean-Claude. On va apprendre la guitare ensemble !')">🔊 Écouter Jean-Claude</button></p><button class="cta" onclick="next()">▶ C’est parti !</button></div></section><section class="grid">${LEVELS.map((l,i)=>`<button class="world" ${unlocked(i)?'':'disabled'} onclick="level(${i})"><div class="ico">${unlocked(i)?l.emoji:'🔒'}</div><small>NIVEAU ${l.id} · ⏱ ${l.time}</small><h2>${l.name}</h2>${l.missions.map((m,j)=>`<div class="missionrow"><b>${j+1}</b> ${m.title}</div>`).join('')}</button>`).join('')}</section>`}function level(i){let l=LEVELS[i];app.innerHTML=`<button class="primary back" onclick="home()">← Accueil</button><div class="panel"><div style="text-align:center;font-size:58px">${l.emoji}</div><h1 style="text-align:center">Niveau ${l.id} : ${l.name}</h1><p style="text-align:center"><button class="primary" onclick="speak('Bienvenue dans le niveau ${l.name}. Prends ton temps et amuse-toi !')">🔊 Jean-Claude présente le niveau</button></p></div><div style="margin-top:12px">${l.missions.map(m=>`<button class="world" style="min-height:0;margin:10px 0;width:100%;display:flex;align-items:center;gap:15px" onclick="lesson(${i},'${m.id}')"><span style="font-size:38px">${p.done[m.id]?'✅':m.icon}</span><b style="font-size:20px">${m.title}</b><span style="margin-left:auto">›</span></button>`).join('')}</div>`}function demo(kind){if(kind==='posture')return 'posture';let map={strings:'👍<br>↓<br>━━━━<br>━━━━<br>━━━━<br>━━━━<br>━━━━<br>━━━━',lion:'🦁 🔊<br>🐭 🔉',beats:'① ② ③ ④',down:'👇 ↓ ↓ ↓ ↓',lights:'🟢 🎸　🔴 ✋',finger:'☝️ ➜ 🎸',pattern:'○ ➜ ● ➜ ○',scale3:'🔴 DO　🟠 RÉ　🟡 MI',scale4:'DO ↗ RÉ ↗ MI ↗ FA',scaledown:'FA ↘ MI ↘ RÉ ↘ DO',scale5:'🔴🟠🟡🟢🔵',scale8:'🔴🟠🟡🟢🔵🟣🟤⚪',question:'🎵 🎵 🎵 ❓',answer:'🎵 🎵 🎵 ❗',song:'🐢 ➜ 🎸 ➜ ⭐',show:'👋 🎸 👏',stars:'🎸 ✨ ⭐'};return map[kind]||'🎸 🎵 ⭐'}function lesson(i,id){let m=LEVELS[i].missions.find(x=>x.id===id),post=m.demo==='posture';app.innerHTML=`<button class="primary back" onclick="level(${i})">← Missions</button><section class="panel lesson"><div class="visual ${post?'posture':''}">${post?'':`<div class="diagram">${demo(m.demo)}</div>`}</div><div><div style="font-size:52px">${m.icon}</div><h1>${m.title}</h1><p style="font-size:21px;font-weight:800">${m.say}</p><div class="actions"><button class="primary" onclick='speak(${JSON.stringify(m.say)})'>🔊 Écouter Jean-Claude</button>${m.video?`<a class="video" target="_blank" rel="noreferrer" href="${m.video}">▶ Voir la vidéo</a>`:''}<button class="success" onclick="finish('${m.id}',${i})">✓ J’ai réussi !</button></div><div class="advice">💡 Regarde, écoute, puis essaie doucement. Une petite réussite suffit aujourd’hui.</div></div></section>`}function finish(id,i){if(!p.done[id]){p.done[id]=true;p.stars++}save();stars();speak('Bravo ! Tu as gagné une étoile.');setTimeout(()=>level(i),700)}function next(){for(let i=0;i<LEVELS.length;i++){if(LEVELS[i].missions.some(m=>!p.done[m.id]))return level(i)}level(7)}function progressPage(){let total=LEVELS.flatMap(l=>l.missions).length,done=Object.keys(p.done).length,pc=Math.round(done/total*100);app.innerHTML=`<div class="panel"><h1>⭐ Mes progrès</h1><p>${done} missions réussies sur ${total}</p><div class="progress"><div class="bar" style="width:${pc}%"></div></div><h2>${pc}% de l’aventure</h2></div>`}function exportP(){let b=new Blob([JSON.stringify(p,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='jean-claude-progression.json';a.click();URL.revokeObjectURL(u)}function settingsPage(){loadVoices();app.innerHTML=`<div class="settings"><div class="box"><h2>🔊 Voix de Jean-Claude</h2><select id="voice" style="width:100%;padding:12px;border-radius:12px">${voices.map(v=>`<option ${v.name===p.voice?'selected':''}>${v.name}</option>`).join('')}</select><p><button class="primary" onclick="p.voice=document.getElementById('voice').value;save();speak('Bonjour ! Je suis Jean-Claude. Cette voix te plaît ?')">Tester et enregistrer</button></p><small>Les voix proposées dépendent de cet appareil.</small></div><div class="box"><h2>💾 Transférer la progression</h2><button class="primary" onclick="exportP()">⬇ Exporter</button> <button class="primary" onclick="document.getElementById('importFile').click()">⬆ Importer</button></div><div class="box"><h2>👨‍👩‍👧 Conseils</h2><p>Une séance courte suffit. On arrête avant la fatigue et on félicite l’essai.</p></div><div class="box"><h2>🔄 Recommencer</h2><button class="video" onclick="if(confirm('Effacer les étoiles sur cet appareil ?')){p={done:{},stars:0,voice:p.voice};save();home()}">Réinitialiser</button></div></div>`}document.getElementById('importFile').onchange=e=>{let f=e.target.files[0],r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.done)throw 0;p=x;save();home();alert('Progression importée !')}catch{alert('Fichier non reconnu')}};if(f)r.readAsText(f)};home();
</script></body></html>
